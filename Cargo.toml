# =============================================================================
#  R E P S   ·   bvm-lang
# =============================================================================
[package]
name    = "bvm-lang"
version = "2.0.0-alpha.2"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "The LSB bytecode VM: executes bytecode-lang modules with typed and dynamic values, PHP-style ordered maps, exceptions, stackful coroutines, a tracing GC, fuel, and memory budgets."

# Keywords (5 max)
keywords = ["language", "runtime", "vm", "bytecode"]

# Categories
categories = ["development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/bvm-lang"
repository    = "https://github.com/jamesgober/bvm-lang"
documentation = "https://docs.rs/bvm-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bvm_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Hardware float math (sqrt, fma, rounding) from `std`, and a per-VM random
# hash seed. Without it the crate is `no_std` + `alloc` and uses its own
# correctly rounded software float routines and a fixed seed.
std = ["bytecode-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# LSB: the instruction set, module model, and budgeted decoder the VM executes.
# bvm-lang 2.0 runs exactly this format; it has no instruction set of its own.
bytecode-lang = { version = "0.2", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
proptest   = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
